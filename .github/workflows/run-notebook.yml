# Runs the notebook on Kaggle's free GPU, waits for it, and saves its outputs (metrics, charts, model) as a run artifact.
# The Kaggle notebook is public (approved by Malav on 16 Oct 2026).
name: Run Kaggle notebook
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick check run on 20,000 comments"
        type: boolean
        default: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL: malavnaik/moderation-classifier-civil-comments
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q --upgrade kaggle jupytext ipykernel
      - name: Push to Kaggle
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then sed -i 's/^QUICK = False/QUICK = True/' kaggle/notebook.py; fi
          jupytext --to ipynb --set-kernel python3 kaggle/notebook.py -o kaggle/notebook.ipynb
          kaggle kernels push -p kaggle
      - name: Wait for Kaggle to finish
        run: |
          sleep 60
          while true; do
            s=$(kaggle kernels status "$KERNEL" 2>&1 | tr 'A-Z' 'a-z'); echo "$(date -u +%H:%M) $s"
            case "$s" in *complete*) break;; *error*|*cancel*) exit 1;; esac
            sleep 120
          done
      - name: Download outputs
        if: always()
        run: |
          mkdir -p out && kaggle kernels output "$KERNEL" -p out || true
          ls -la out
          grep -oE 'Device: [a-z]+|step [0-9]+/[0-9]+ loss [0-9.]+' out/*.log | tail -5 || true
          [ -f out/metrics.json ] && cat out/metrics.json || tail -c 4000 out/*.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: notebook-output, path: out, if-no-files-found: warn }
