# Copies the latest Kaggle run's DistilBERT model to Hugging Face: the model repo, plus a free static Space
# where a compressed (int8 ONNX) copy runs in the visitor's browser.
# Both are created PRIVATE; Malav makes them public after reviewing them.
name: Publish to Hugging Face
on: workflow_dispatch
env:
  MODEL_REPO: Malavnaik/civil-comments-distilbert-moderation
  SPACE_REPO: Malavnaik/moderation-classifier-demo
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q --upgrade kaggle huggingface_hub datasets transformers onnx onnxruntime
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Get the trained model from Kaggle
        run: |
          kaggle kernels output malavnaik/moderation-classifier-civil-comments -p out
          test -f out/distilbert/model.safetensors
          cp hf/model_card.md out/distilbert/README.md
          cp out/metrics.json out/distilbert/
      - name: Convert for the browser and check agreement
        shell: python
        run: |
          import json, numpy as np, onnxruntime as ort, torch, shutil, os
          from datasets import load_dataset
          from onnxruntime.quantization import QuantType, quantize_dynamic
          from transformers import AutoModelForSequenceClassification, AutoTokenizer
          d = "out/distilbert"
          LABELS = ["toxicity", "obscene", "identity_attack", "insult", "threat"]
          cfg = json.load(open(f"{d}/config.json"))
          cfg["id2label"] = dict(enumerate(LABELS)); cfg["label2id"] = {l: i for i, l in enumerate(LABELS)}
          json.dump(cfg, open(f"{d}/config.json", "w"), indent=1)
          tok = AutoTokenizer.from_pretrained(d)
          model = AutoModelForSequenceClassification.from_pretrained(d).eval()
          os.makedirs(f"{d}/onnx", exist_ok=True)
          ex = tok(["hello world"], return_tensors="pt")
          torch.onnx.export(model, (ex["input_ids"], ex["attention_mask"]), f"{d}/onnx/model.onnx", input_names=["input_ids", "attention_mask"],
                            output_names=["logits"], dynamic_axes={n: {0: "batch", 1: "seq"} for n in ["input_ids", "attention_mask", "logits"]},
                            opset_version=14, dynamo=False)
          quantize_dynamic(f"{d}/onnx/model.onnx", f"{d}/onnx/model_quantized.onnx", weight_type=QuantType.QInt8)
          texts = load_dataset("google/civil_comments", split="test").shuffle(seed=42).select(range(2000))["text"]
          sess = ort.InferenceSession(f"{d}/onnx/model_quantized.onnx")
          full, small = [], []
          for i in range(0, len(texts), 64):
              e = tok(texts[i:i + 64], truncation=True, max_length=128, padding=True, return_tensors="np")
              with torch.no_grad():
                  full.append(torch.sigmoid(model(input_ids=torch.tensor(e["input_ids"]), attention_mask=torch.tensor(e["attention_mask"])).logits)[:, 0].numpy())
              small.append(1 / (1 + np.exp(-sess.run(None, {"input_ids": e["input_ids"], "attention_mask": e["attention_mask"]})[0][:, 0])))
          full, small = np.concatenate(full), np.concatenate(small)
          T = json.load(open(f"{d}/thresholds.json"))
          bucket = lambda p: np.digitize(p, [T["send_to_review"], T["auto_action"]])
          agree = {"comments": len(texts), "max_abs_diff": round(float(np.abs(full - small).max()), 4),
                   "mean_abs_diff": round(float(np.abs(full - small).mean()), 4),
                   "same_decision_share": round(float((bucket(full) == bucket(small)).mean()), 4)}
          print("Browser model vs full model (toxicity):", agree)
          json.dump(agree, open(f"{d}/browser_agreement.json", "w"))
          os.makedirs("space/model/onnx", exist_ok=True)
          for f in ["config.json", "tokenizer.json", "tokenizer_config.json", "thresholds.json"]:
              shutil.copy(f"{d}/{f}", "space/model/")
          shutil.copy(f"{d}/onnx/model_quantized.onnx", "space/model/onnx/")
          print("Browser model size MB:", round(os.path.getsize(f"{d}/onnx/model_quantized.onnx") / 1e6, 1))
      - name: Upload (private)
        shell: python
        run: |
          import os, time
          from huggingface_hub import HfApi
          api = HfApi()
          m, s = os.environ["MODEL_REPO"], os.environ["SPACE_REPO"]
          api.create_repo(m, private=True, exist_ok=True)
          api.upload_folder(repo_id=m, folder_path="out/distilbert", commit_message="Model from Kaggle run")
          api.create_repo(s, repo_type="space", space_sdk="static", private=True, exist_ok=True)
          api.upload_folder(repo_id=s, repo_type="space", folder_path="space", commit_message="Demo app")
          print(f"Model: https://huggingface.co/{m}\nSpace: https://huggingface.co/spaces/{s}")
          time.sleep(30)
          print("Space:", api.get_space_runtime(s).stage)
