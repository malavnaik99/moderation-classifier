# One-off: copies distilbert-base-uncased (Apache-2.0) from Hugging Face into a Kaggle dataset,
# because notebooks in the Jigsaw competition must run with internet off.
name: Base model as Kaggle dataset
on: workflow_dispatch
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - run: pip install -q --upgrade kaggle huggingface_hub
      - name: Download from Hugging Face
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('distilbert/distilbert-base-uncased', local_dir='ds', allow_patterns=['config.json','model.safetensors','tokenizer.json','tokenizer_config.json','vocab.txt'])"
          rm -rf ds/.cache
          cat > ds/dataset-metadata.json <<'JSON'
          {"title": "distilbert-base-uncased (copy for offline notebooks)", "id": "malavnaik/distilbert-base-uncased", "licenses": [{"name": "apache-2.0"}]}
          JSON
          ls -la ds
      - run: kaggle datasets create -p ds
